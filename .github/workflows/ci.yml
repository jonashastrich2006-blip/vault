name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc python3-dev libsqlcipher-dev
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -r requirements-test.txt
          pip install .
      - name: python-flake8
        uses: julianwachholz/flake8-action@75749239077651dfd0ecbe405899cdcb0673ee8f
        with:
          checkName: python-flake8
      - name: gh-action-pip-audit
        uses: pypa/gh-action-pip-audit@d499194be74aeb3bc7dbed3a224a87e1831132c7
      - name: Bandit Action
        uses: mdegis/bandit-action@851671cb116c1d3638de86975006bddf2619362a
      - name: Run pytest
        run: |
          coverage run --source=. -m pytest
      - name: Generate coverage report
        run: |
          coverage report -m
          coverage xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: py${{ matrix.python-version }}
          # Fork PRs get no secrets and upload tokenless; only fail hard on pushes
          fail_ci_if_error: ${{ github.event_name == 'push' }}
